<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Date Converter</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #1f2328; --muted: #6b7280;
    --border: #d0d7de; --accent: #2563eb; --ok: #16a34a; --err: #dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117; --card: #161b22; --text: #e6edf3; --muted: #8b949e;
      --border: #30363d; --accent: #3b82f6; --ok: #22c55e; --err: #f87171;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, sans-serif;
    padding: 16px;
  }
  .card {
    width: 100%; max-width: 440px; background: var(--card);
    border: 1px solid var(--border); border-radius: 12px; padding: 24px;
  }
  h1 { font-size: 1.25rem; margin: 0 0 16px; }
  label { display: block; font-size: .875rem; color: var(--muted); margin: 12px 0 6px; }
  input, select {
    width: 100%; font-size: 1.125rem; padding: 10px 12px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text);
  }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .row { display: flex; gap: 8px; }
  .row input { flex: 1; font-family: ui-monospace, Menlo, Consolas, monospace; }
  button {
    font-size: 1rem; padding: 0 18px; border: 0; border-radius: 8px;
    background: var(--accent); color: #fff; cursor: pointer; white-space: nowrap;
  }
  button:disabled { opacity: .5; cursor: default; }
  .msg { min-height: 1.25em; font-size: .875rem; margin-top: 8px; }
  .msg.ok { color: var(--ok); }
  .msg.err { color: var(--err); }
</style>
</head>
<body>
<main class="card">
  <h1>Date Format Converter</h1>

  <label for="input">Enter a date (e.g. 01-10-2026, 01.10.2026, 01 10 2026)</label>
  <input id="input" type="text" placeholder="01-10-2026" autocomplete="off" autofocus>

  <label for="sep">Output separator</label>
  <select id="sep">
    <option value="/">/ (01/10/2026)</option>
    <option value="-">- (01-10-2026)</option>
    <option value=".">. (01.10.2026)</option>
  </select>

  <label for="output">Result (press Enter or click to copy)</label>
  <div class="row">
    <input id="output" type="text" readonly>
    <button id="copy" disabled>Copy</button>
  </div>
  <div id="msg" class="msg"></div>
</main>

<script>
  const input = document.getElementById('input');
  const sep = document.getElementById('sep');
  const output = document.getElementById('output');
  const copyBtn = document.getElementById('copy');
  const msg = document.getElementById('msg');

  function setMsg(text, cls) { msg.textContent = text; msg.className = 'msg ' + (cls || ''); }

  function convert() {
    const raw = input.value.trim();
    if (!raw) { output.value = ''; copyBtn.disabled = true; setMsg(''); return; }

    // Split on any non-digit characters (-, ., /, space, etc.)
    const parts = raw.split(/\D+/).filter(Boolean);
    let a, b, c;
    if (parts.length === 3) {
      [a, b, c] = parts;
    } else if (parts.length === 1 && /^\d{8}$/.test(parts[0])) {
      // 01102026 -> 01 10 2026
      a = parts[0].slice(0, 2); b = parts[0].slice(2, 4); c = parts[0].slice(4);
    } else {
      output.value = ''; copyBtn.disabled = true;
      setMsg('Unrecognized format. Try something like 01-10-2026', 'err');
      return;
    }
    const pad = s => s.length === 1 ? '0' + s : s;
    output.value = [pad(a), pad(b), c].join(sep.value);
    copyBtn.disabled = false;
    setMsg('');
  }

  async function copy() {
    if (!output.value) return;
    try {
      await navigator.clipboard.writeText(output.value);
    } catch (e) {
      output.select();
      document.execCommand('copy');
    }
    setMsg('Copied: ' + output.value, 'ok');
  }

  input.addEventListener('input', convert);
  sep.addEventListener('change', convert);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') copy(); });
  copyBtn.addEventListener('click', copy);
  output.addEventListener('click', copy);
</script>
</body>
</html>
